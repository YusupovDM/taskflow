worker_processes auto;
events { worker_connections 1024; }

http {
    log_format main '$remote_addr "$request" $status upstream=$upstream_addr '
                    'rt=$request_time req_id=$req_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    upstream auth_service         { server auth-service:8000; }
    # zone — общее состояние балансировщика для всех воркеров (иначе least_conn у каждого свой)
    upstream task_service         { zone task_service 64k; least_conn; server task-service-1:8000; server task-service-2:8000; }
    upstream notification_service { server notification-service:8000; }

    server {
        listen 80;
        client_max_body_size 1m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;
        proxy_hide_header X-Request-ID;   # сервис тоже возвращает его — не дублируем
        add_header X-Request-ID    $req_id always;
        add_header X-Upstream-Addr $upstream_addr always;

        # строгий лимит на логин/регистрацию (защита от перебора)
        location = /api/v1/auth/login    { limit_req zone=auth_limit burst=5 nodelay; proxy_pass http://auth_service; }
        location = /api/v1/auth/register { limit_req zone=auth_limit burst=5 nodelay; proxy_pass http://auth_service; }

        location /api/v1/auth/          { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://auth_service; }
        location /api/v1/users          { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://auth_service; }
        location /api/v1/projects       { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://task_service; }
        location /api/v1/tasks          { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://task_service; }
        location /api/v1/notifications  { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://notification_service; }

        location /docs/auth          { proxy_pass http://auth_service; }
        location /docs/tasks         { proxy_pass http://task_service; }
        location /docs/notifications { proxy_pass http://notification_service; }

        location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
        location /metrics  { deny all; }
    }
}
