x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

x-task-service: &task-service
  build: ./task-service
  image: taskflow/task-service
  env_file: .env
  environment: { DB_NAME: tasks_db, SERVICE_NAME: task-service }
  depends_on:
    task-migrations: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  healthcheck: *app-healthcheck
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5433:5432"]  # для локальных тестов и psql; 5433 — чтобы не конфликтовать с локальным PostgreSQL
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["15672:15672"]  # management UI
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 10s, retries: 10 }
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    image: taskflow/auth-service
    env_file: .env
    environment: { DB_NAME: auth_db, SERVICE_NAME: auth-service }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  task-migrations:
    build: ./task-service
    image: taskflow/task-service
    env_file: .env
    environment: { DB_NAME: tasks_db }
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  task-service-1:
    <<: *task-service

  task-service-2:
    <<: *task-service

  notification-service:
    build: ./notification-service
    image: taskflow/notification-service
    env_file: .env
    environment: { DB_NAME: notifications_db, SERVICE_NAME: notification-service }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *app-healthcheck
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      auth-service: { condition: service_healthy }
      task-service-1: { condition: service_healthy }
      task-service-2: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [auth-service, task-service-1, task-service-2, notification-service]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
